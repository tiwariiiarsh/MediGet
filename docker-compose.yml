services:
  postgres:
    image: postgres:16
    container_name: mediget-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: medisearch
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d medisearch"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  backend:
    build: .
    container_name: mediget-backend
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - ./images:/app/images
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
