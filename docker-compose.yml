services:
  mysql:
    image: mysql:8.0
    container_name: mediget-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: medisearch
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  backend:
    build: .
    container_name: mediget-backend
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - ./images:/app/images
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
