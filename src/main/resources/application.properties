spring.application.name=MediSearch

# ===============================
# MySQL Database Configuration
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

server.port=8080

# ===============================
# JWT Configuration
# ===============================
spring.app.jwtSecret=${JWT_SECRET}
spring.ecom.app.jwtCookieName=jwtCookieName
spring.app.jwtExpirationMs=3000000


product.image=images/
image.base.url=http://localhost:8080/images
# Image upload limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Serve images from folder
spring.web.resources.static-locations=classpath:/static/,file:images/

# ===============================
# Frontend Configuration
# ===============================
frontend.url=http://localhost:5173